<!DOCTYPE html>
<html lang="cs">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LCD do DSC-WX200/220</title>
  <meta name="keywords" content=", DSC-WX200/220, LCD, SONY, nahradni dil">
  <meta name="description" content="Nahradni LCD pro SONY DSC-WX200/220">
  <style>
    :root {
      --primary: #0056b3;
      --primary-hover: #003d82;
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #212529;
      --text-muted: #6c757d;
      --border: #dee2e6;
      --price-text: #198754;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 16px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    .nav-bar {
      margin-bottom: 16px;
    }
    .back-btn {
      display: inline-block;
      text-decoration: none;
      color: var(--primary);
      font-weight: 600;
      padding: 8px 14px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .back-btn:hover {
      background: #f1f1f1;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 16px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 10px;
    }
    
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }
    @media (min-width: 650px) {
      .detail-grid {
        grid-template-columns: 260px 1fr;
      }
    }
    
    .photo-box {
      text-align: center;
    }
    .photo-box img {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .param-table {
      width: 100%;
      border-collapse: collapse;
    }
    .param-table th, .param-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }
    .param-table th {
      width: 35%;
      color: var(--text-muted);
      font-weight: 600;
      background: #fafafa;
    }
    .price-tag {
      font-size: 1.15rem;
      font-weight: bold;
      color: var(--price-text);
    }
    
    .btn-contact {
      display: block;
      width: 100%;
      text-align: center;
      background-color: var(--primary);
      color: white !important;
      text-decoration: none;
      padding: 12px 18px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      margin-top: 18px;
    }
    .btn-contact:hover {
      background-color: var(--primary-hover);
    }

    .info-section {
      margin-top: 20px;
    }
    .info-section h2 {
      font-size: 1.1rem;
      margin-bottom: 8px;
      color: #333;
    }
    .info-box-text {
      background: #fafafa;
      padding: 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>

<div class="container">
  <div class="nav-bar">
    <a href="index.html" class="back-btn">&larr; Zpět na seznam dílů</a>
  </div>

  <div class="card">
    <h1>LCD DSC-WX200/220</h1>

    <div class="detail-grid">
      <div class="photo-box">
        <img src="index_156.jpg" alt="Fotografie dílu: DSC-WX200/220" onerror="this.style.display='none'">
      </div>

      <div>
        <table class="param-table">
          <tr>
            <th>Typ dílu:</th>
            <td></td>
          </tr>
          <tr>
            <th>P/N:</th>
            <td><strong>A-1923-978-A</strong></td>
          </tr>
          <tr>
            <th>Ekvivalent(y):</th>
            <td></td>
          </tr>
          <tr>
            <th>Cena za nový díl:</th>
            <td><span class="price-tag">642 Kč</span></td>
          </tr>
          <tr>
            <th>Cena za použitý díl:</th>
            <td><span class="price-tag"> Kč</span></td>
          </tr>
        </table>

        <a href="mailto:cybershot@volny.cz?subject=Dotaz na LCD do DSC-WX200/220" class="btn-contact">
          Napsat dotaz / poptat tento díl
        </a>
      </div>
    </div>

    <div class="info-section">
      <h2>Vhodné pro fotoaparáty:</h2>
      <div class="info-box-text">
        DSC-WX200, DSC-WX220
      </div>
    </div>

    <div class="info-section">
      <h2>Detailní popis:</h2>
      <div class="info-box-text">
        Náhradní LCD displej do fotoaparátů Cybershot výše uvedeného typu.
      </div>
    </div>
  </div>
</div>

</body>
</html>
